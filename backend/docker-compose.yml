services:
  db:
    image: postgres:15-alpine
    container_name: erp_db
    restart: always
    env_file:
      - ./.env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5440:5432"
    networks:
      - app-network

  api:
    container_name: erp_api
    build: .
    image: erp-api:latest
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=db
    env_file:
      - ./.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  tunnel:
    image: alpine:latest
    container_name: serveo_tunnel
    restart: always
    volumes:
      - ./ssh_keys:/root/.ssh
    command: >
      sh -c "apk add --no-cache openssh-client && mkdir -p /root/.ssh && [ -f /root/.ssh/id_rsa ] || ssh-keygen -t rsa -b 2048 -f /root/.ssh/id_rsa -N '' && ssh -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R ${DEV_SUBDOMAIN}:80:api:8000 serveo.net"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
