services:
  db:
    image: postgres:15-alpine
    container_name: erp_db
    restart: always
    env_file:
      - ./.env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5440:5432"
    networks:
      - app-network

  api:
    container_name: erp_api
    build: .
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=db
    env_file:
      - ./.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  tunnel:
    image: node:alpine
    container_name: localtunnel_tunnel
    restart: always
    command: >
      sh -c "npm install -g localtunnel &&  lt --port 8000 --host http://localtunnel.me --subdomain ${DEV_SUBDOMAIN} --local-host api"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
